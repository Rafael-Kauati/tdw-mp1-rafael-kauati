version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.20.0

jobs:
  install:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - node-deps-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: node-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  sast:
    executor: node
    steps:
      - checkout
      - run:
          name: SonarQube Cloud analysis
          command: |
            npx --yes sonar-scanner \
              -Dsonar.token="$SONAR_TOKEN"

  code-quality:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: ESLint
          command: npm run lint

  formatting:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Prettier
          command: npm run format:check

  tests:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Vitest
          command: npm run test

  build:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build Next.js static site
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - out

  deploy-production:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Deploy production to Cloudflare Pages
          command: |
            npx --yes wrangler pages deploy ./out \
              --project-name=mp1-rafael-kauati \
              --branch=main

  deploy-dev:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Deploy development to Cloudflare Pages
          command: |
            npx --yes wrangler pages deploy ./out \
              --project-name=mp1-rafael-kauati \
              --branch=dev

workflows:
  ci-cd:
    jobs:
      - install

      - sast:
          requires:
            - install

      - code-quality:
          requires:
            - install

      - formatting:
          requires:
            - install

      - tests:
          requires:
            - install

      - build:
          requires:
            - sast
            - code-quality
            - formatting
            - tests

      - deploy-production:
          requires:
            - build
          filters:
            branches:
              only: main

      - deploy-dev:
          requires:
            - build
          filters:
            branches:
              only: dev
