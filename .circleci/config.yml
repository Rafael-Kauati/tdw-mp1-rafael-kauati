version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.20.0

jobs:
  install:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - node-deps-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: node-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  sast:
    docker:
      - image: sonarsource/sonar-scanner-cli:latest
    steps:
      - checkout
      - run:
          name: SonarQube Cloud analysis
          command: sonar-scanner

  code-quality:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: ESLint
          command: npm run lint

  formatting:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Prettier
          command: npm run format:check

  tests:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Vitest
          command: npm run test

  build:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build Next.js static site
          command: |
            npm run build
            test -d out
            test -f out/index.html
      - persist_to_workspace:
          root: .
          paths:
            - out

  deploy-production:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Deploy production to Cloudflare Pages
          command: |
            npx --yes wrangler pages deploy ./out \
              --project-name=mp1-rafael-kauati \
              --branch=main

  deploy-dev:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Deploy development preview to Cloudflare Pages
          command: |
            npx --yes wrangler pages deploy ./out \
              --project-name=mp1-rafael-kauati \
              --branch=dev

  deploy-pr-preview:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Deploy pull request preview to Cloudflare Pages
          command: |
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "No pull request URL found; skipping preview deployment."
              exit 0
            fi

            PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | grep -oE '[0-9]+$')

            if [ -z "$PR_NUMBER" ]; then
              echo "Could not determine pull request number."
              exit 1
            fi

            npx --yes wrangler pages deploy ./out \
              --project-name=mp1-rafael-kauati \
              --branch="pr-${PR_NUMBER}"

workflows:
  ci-cd:
    jobs:
      - install

      - sast:
          requires:
            - install

      - code-quality:
          requires:
            - install

      - formatting:
          requires:
            - install

      - tests:
          requires:
            - install

      - build:
          requires:
            - sast
            - code-quality
            - formatting
            - tests

      - deploy-production:
          requires:
            - build
          filters:
            branches:
              only: main

      - deploy-dev:
          requires:
            - build
          filters:
            branches:
              only: dev

      - deploy-pr-preview:
          requires:
            - build
          filters:
            branches:
              ignore:
                - main
                - dev
