name: CInCD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types:
      - opened
      - reopened
  repository_dispatch:
    types:
      - cms-content-updated
  workflow_dispatch:
#  schedule:
#    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install
  sast:
    name: SonarQube SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Run ESLint
        run: npm run lint

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Check Prettier formatting
        run: npm run format:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Run Vitest tests
        run: npm test

  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - formatting
      - tests
      - sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Build application
        run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}

      - name: Verify build output
        run: |
          set -e
          test -f .next/BUILD_ID
          test -d out
          test -f out/index.html
          echo "Build verification successful."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-static-site
          path: out/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Production or Dev Preview
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) ||
      (github.event_name == 'repository_dispatch' &&
        github.ref == 'refs/heads/main')

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-static-site
          path: ./deploy-artifact

      - name: Verify downloaded artifact
        run: |
          set -e
          test -f ./deploy-artifact/index.html
          echo "Artifact verified successfully."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./deploy-artifact --project-name=mp1-rafael-kauati --branch=${{ github.ref_name }}

  preview-deploy:
    name: Deploy Pull Request Preview
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-static-site
          path: ./deploy-artifact

      - name: Verify downloaded artifact
        run: |
          set -e
          test -f ./deploy-artifact/index.html
          echo "Preview artifact verified successfully."

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./deploy-artifact --project-name=mp1-rafael-kauati --branch=pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on pull request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const prNumber = process.env.PR_NUMBER;
            const previewUrl = `https://pr-${prNumber}.mp1-rafael-kauati.pages.dev`;

            const body = [
              marker,
              '### Cloudflare Pages Preview',
              '',
              `Preview deployment: [Open preview](${previewUrl})`,
              '',
              '_This link is updated when new commits are pushed to this pull request._'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = Number(prNumber);

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existingComment = comments.find(comment =>
              comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
