name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}

      - name: Verify build output
        run: test -f .next/BUILD_ID

      - name: Verify artifact path
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Build ID:"
          cat "$GITHUB_WORKSPACE/.next/BUILD_ID"
          echo "Files to upload:"
          find "$GITHUB_WORKSPACE/.next" -type f | head -30

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: production-build
          path: .next/

      - name: Run ESLint
        run: npm run lint

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: production-build
          path: .next/

      - name: Check Prettier formatting
        run: npm run format:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: production-build
          path: .next/

      - name: Run Vitest tests
        run: npm test